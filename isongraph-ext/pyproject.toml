[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isongraph-ext"
version = "0.2.0"
description = "ISONGraphExt - IGX/1 extension bindings and IGPV/1 provenance with verifiable identity claims over ISONGraph Core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Mahesh Vaikri"}]
requires-python = ">=3.12"
# Exact pins: the reference runtime IS the implementation the Core baseline was measured with (17 §3, §4 V0).
dependencies = ["ison-py==1.2.0", "ison-graph==1.4.1"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.urls]
Repository = "https://github.com/ISON-format/isongraph-ext"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isongraph_ext = ["py.typed", "baselines/REGISTRY.ison", "baselines/*/MANIFEST.ison", "baselines/*/domains.ison", "baselines/*/receipts/*.ison"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
pythonpath = ["src"]
