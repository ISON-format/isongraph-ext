# Publishes to PyPI via Trusted Publishing (GitHub OIDC): no tokens, no secrets. See CONTRIBUTING.md, section Releasing.
#
# The pypi.org publisher must carry exactly these claims:
#   PyPI project isongraph-ext | Owner ISON-format | Repository isongraph-ext | Workflow publish-pypi.yml | Environment pypi
# Renaming this file or the environment breaks the publisher's claim match: change both sides together.
#
# Triggers:
#   release published  -> build from the release tag, then publish to PyPI.
#   workflow_dispatch  -> build from `ref` (a v-tag, required) and publish to PyPI.
# The build job refuses to continue unless the checked-out package version equals the tag (vX.Y.Z) and the tagged commit is on main.

name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to build and publish to PyPI (vX.Y.Z)
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isongraph-ext
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag must be a v-tag equal to the package version
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG"; exit 1;; esac
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "v$VERSION"
      - name: Tagged commit must be reachable from main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: pip install twine
      - run: python -m build
      - run: twine check dist/*
      - run: pytest tests/test_packaging.py tests/test_examples.py -q --built
      - run: pip install dist/*.whl --force-reinstall --no-deps && python -c "import isongraph_ext.igx.baselines as b; print(b.DEFAULT_BASELINE.core_commit)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: isongraph-ext/dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isongraph-ext
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
